name: Bug Report
description: Something is broken or producing incorrect results.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps or code snippet to reproduce the issue.
      placeholder: |
        1. Config used (paste relevant TOML section)
        2. Command run
        3. Error / unexpected output
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Run `python -m ftnet.helper.collect_env` and paste the output here.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: dataset
    attributes:
      label: Dataset
      options:
        - SODA
        - MFN
        - SCUT-Seg
        - Cityscapes Thermal
        - Other / N/A
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, screenshots, or anything else that might help.
